      d.lancamentos.push({data: e.data, grupo, tipo: 'gasto', descricao: e.descricao || e.categoria, valor: -Math.abs(+e.valor), meio: e.meio === 'cartao' ? 'cartão' : e.meio, categoria: e.categoria, local: true});
      const ultimo = d.gasto_diario.reduce((m, r) => (r.data > m ? r.data : m), '');
      for (let k = addDia(ultimo, 1); k <= e.data; k = addDia(k, 1)) d.gasto_diario.push({data: k, grupo: 'PF', gasto: 0}, {data: k, grupo: 'PJ', gasto: 0});
      const row = d.gasto_diario.find((r) => r.data === e.data && r.grupo === grupo); if (row) row.gasto = Math.round((row.gasto + Math.abs(+e.valor)) * 100) / 100;
      // Bens não cabem no orçamento do dia: saem do dinheiro (à vista) ou entram nas faturas (cartão, parcelado)
      if (BENS.includes(e.categoria)) {
        if (e.meio === 'cartao') { const n = Math.max(1, +e.parcelas || 1); for (let i = 0; i < n; i++) d.agenda.push({data: proxFatura(e.data, i), grupo, descricao: (e.descricao || 'Bem') + (n > 1 ? ' (' + (i + 1) + '/' + n + ')' : ''), tipo: 'fatura', status: 'confirmado', valor: -Math.round(Math.abs(+e.valor) / n * 100) / 100}); }
        else { const c = d.contas.find((x) => (e.meio === 'dinheiro' ? x.tipo === 'dinheiro' : x.grupo === grupo && x.tipo === 'conta')); if (c) c.saldo = Math.round((+c.saldo - Math.abs(+e.valor)) * 100) / 100; }
      }
    });
    d.agenda.sort((a, b) => (a.data < b.data ? -1 : 1));
    return d;
  };
  const calcular = (dados) => {
    const r = Object.assign({}, dados);
    let falta = Object.keys(calcs), voltas = 0;
    while (falta.length && voltas++ < 30) falta = falta.filter((id) => { const o = calcs[id]; if (!o.inputs.every((i) => i in r)) return true; try { r[id] = o.fn(...o.inputs.map((i) => r[i])); } catch (e) { console.error(id, e); } return false; });
    return r;
  };
  const desenha = () => { document.querySelectorAll('[data-draw]').forEach((el) => { const f = draws[el.dataset.draw]; if (f) try { f(el); } catch (e) { console.error(el.dataset.draw, e); } }); cbs.forEach((f) => f()); };
  const rodar = () => { res = calcular(aplicar(lerLocal())); desenha(); };
  rodar();
  let w = innerWidth, t; addEventListener('resize', () => { if (innerWidth === w) return; w = innerWidth; clearTimeout(t); t = setTimeout(desenha, 200); });

  // ===== Lançar / simular no celular =====
  const brl = (v) => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  const el = (tag, css, txt) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; return e; };
  const st = document.createElement('style');
  st.textContent = '.lz-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;padding:14px 18px;font:600 15px var(--font-anthropic-sans);background:var(--color-ok);color:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}'
    + '.lz-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49}.lz-sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:50;background:var(--color-panel);color:var(--color-fg);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;font-family:var(--font-anthropic-sans)}'
    + '.lz-sheet input,.lz-sheet select{width:100%;box-sizing:border-box;border:1px solid var(--color-border-line);background:var(--bg);color:var(--color-fg);font:inherit;padding:10px;border-radius:10px}'
    + '.lz-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lz-btn{border:0;border-radius:12px;padding:12px;font:600 15px var(--font-anthropic-sans);cursor:pointer}'

  document.head.appendChild(st);
  const fab = el('button', '', '＋ Lançar ou simular'); fab.className = 'lz-fab'; document.body.appendChild(fab);
  const resumo = (r) => { const e = r.eco_auto || {}, m = (r.relatorio_meses || []); return {livre: e.livre, total: e.total, corte: e.corte_data, meses: m.map((x) => [x.mes, x.fim_meta])}; };
  const nomeMes = (m) => ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+m.slice(5) - 1];
  const dataExt = (k) => +k.slice(8) + ' de ' + ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][+k.slice(5, 7) - 1];
  fab.onclick = () => {
    const back = el('div'); back.className = 'lz-back'; const sh = el('div'); sh.className = 'lz-sheet';
    const fecha = () => { back.remove(); sh.remove(); }; back.onclick = fecha;
    const top = el('div', 'display:flex;justify-content:space-between;align-items:center'); top.append(el('b', 'font-size:18px', 'Lançar ou simular'), Object.assign(el('button', 'border:1px solid var(--color-border-line);background:none;color:var(--color-fg);border-radius:999px;padding:4px 12px;font:inherit', 'Fechar'), {onclick: fecha}));
    const tipo = el('select'); [['Bens', 'Bem durável (objeto, plugin, equipamento)'], ['', 'Gasto livre (comida, lanche, farmácia...)'], ['Combustível', 'Combustível'], ['Assinatura', 'Assinatura']].forEach(([v, t]) => tipo.appendChild(new Option(t, v)));

      const cat = tipo.value === 'Bens' ? 'Objetos' : tipo.value; return {data: data.value || hojeIso(), valor: v, descricao: desc.value.trim(), categoria: cat, meio: meio.value, parcelas: meio.value === 'cartao' ? +parc.value : 1, conta: conta.value, criado: Date.now()}; };
    const efeito = (e) => {
      const antes = resumo(res), depois = resumo(calcular(aplicar(lerLocal().concat([e]))));

      out.append(el('div', 'font-weight:600;margin-bottom:4px', (e.categoria === 'Objetos' ? 'Bem de ' : 'Gasto de ') + brl(e.valor) + (e.parcelas > 1 ? ' em ' + e.parcelas + 'x no cartão' : '')));

      if (depois.corte && depois.corte !== antes.corte) out.append(el('div', 'color:var(--color-warn)', 'Corte de assinatura passaria a ser preciso em ' + dataExt(depois.corte) + '.'));

    };
    const bSim = el('button', 'background:var(--color-border-line);color:var(--color-fg)', 'Simular'); bSim.className = 'lz-btn'; bSim.onclick = () => { const e = ler(); if (e) efeito(e); };

    const ul = el('div');
    const lista = () => { ul.replaceChildren(); const l = lerLocal(); if (!l.length) return; ul.append(el('b', 'margin-top:6px;display:block', 'Lançados neste celular'));
      const d0 = BASE, base = param(d0, 'data_base');
      l.slice().reverse().forEach((e) => { const li = el('div'); li.className = 'lz-li'; const ja = e.data <= base && noBanco(d0, e);
        li.append(el('span', '', dataExt(e.data) + ' · ' + (e.descricao || e.categoria || 'Gasto livre') + (ja ? ' · ✓ já no banco' : '')), el('span', 'white-space:nowrap', brl(e.valor)));
        const x = el('button', 'border:0;background:none;color:var(--color-bad);font:inherit;cursor:pointer', 'apagar'); x.onclick = () => { salvarLocal(lerLocal().filter((y) => y.criado !== e.criado)); rodar(); lista(); }; li.append(x); ul.append(li); }); };
    const linha = (a, b) => { const r = el('div'); r.className = 'lz-row'; r.append(a, b); return r; };

    const msgPiso = el('span', 'font-size:13px;color:var(--color-fg-muted)', 'O mínimo que o caixa nunca pode ficar abaixo. A meta se recalcula na hora.');
    bPiso.onclick = () => { const v = Number(String(piso.value).replace(/\./g, '').replace(',', '.')); if (!(v >= 0)) { msgPiso.textContent = 'Digite um valor.'; return; }
      const antes = resumo(res); const c = lerConfig(); c.piso = v; salvarConfig(c); rodar(); const dep = resumo(res);
      msgPiso.textContent = '✓ Reserva mínima: ' + brl(v) + '. Gasto livre por dia: ' + brl(antes.livre) + ' → ' + brl(dep.livre) + '.'; };
    cfgBox.append(el('b', '', 'Reserva mínima no caixa'), linha(piso, bPiso), msgPiso);
    sh.append(top, tipo, linha(valor, data), desc, linha(meio, conta), parc, linha(bSim, bLan), out, ul, cfgBox);
    const syncParc = () => { parc.style.display = meio.value === 'cartao' ? '' : 'none'; }; meio.onchange = syncParc; syncParc();
    lista(); document.body.append(back, sh); valor.focus();
  };
})();
