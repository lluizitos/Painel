  } catch (e) { trava.textContent = 'Não foi possível abrir. Confira se o link está completo.'; return; }
  trava.remove();
  // mini runtime no lugar do painel do Claude
  const calcs = {}, draws = {}, cbs = [], res = Object.assign({}, p.data);
  window.dash = {colors: ['#3b82f6', '#e8682a'], calc: (id, o) => { calcs[id] = o; }, draw: (id, f) => { draws[id] = f; }, onData: (f) => cbs.push(f),
    data: (id) => id in res ? {status: 'ok', data: res[id]} : {status: 'error', data: null}};
  const box = document.getElementById('app');
  const tmp = document.createElement('div'); tmp.innerHTML = p.html;
  const scripts = [...tmp.querySelectorAll('script')].map((s) => { s.remove(); return s.textContent; });
  box.append(...tmp.childNodes);
  scripts.forEach((src) => { const s = document.createElement('script'); s.textContent = src; document.body.appendChild(s); });
  let falta = Object.keys(calcs), voltas = 0;
  while (falta.length && voltas++ < 30) falta = falta.filter((id) => { const o = calcs[id]; if (!o.inputs.every((i) => i in res)) return true; try { res[id] = o.fn(...o.inputs.map((i) => res[i])); } catch (e) { console.error(id, e); } return false; });
  const desenha = () => { document.querySelectorAll('[data-draw]').forEach((el) => { const f = draws[el.dataset.draw]; if (f) try { f(el); } catch (e) { console.error(el.dataset.draw, e); } }); cbs.forEach((f) => f()); };
  desenha();
  let w = innerWidth, t; addEventListener('resize', () => { if (innerWidth === w) return; w = innerWidth; clearTimeout(t); t = setTimeout(desenha, 200); });
})();
</script>
